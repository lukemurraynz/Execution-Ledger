# Pinned to 0.8 (not workspace-inherited): the `pgp` crate's public API
# (MessageBuilder::seipd_v1/encrypt_to_key/generate, etc.) is generic over
# `RAND: rand::Rng + rand::CryptoRng` resolved against rand 0.8.6, its own
# pinned internal dependency. A caller-supplied RNG from a different major
# rand version doesn't satisfy those trait bounds (different crate = different
# trait, even with an identical name), so this must track whatever `pgp`
# itself depends on, independent of the workspace-wide rand version.
rand = "0.8"

